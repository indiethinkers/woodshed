[install]
# Refuse to install package versions younger than 7 days. Mitigates fast-moving
# supply-chain attacks (e.g. TanStack Router compromise, Nov 2025) where
# malicious versions are published and yanked within hours.
minimumReleaseAge = 604800
# Security exceptions: these exact versions fix active audit findings and are
# pinned in package.json. Remove each exception after its release is seven days
# old.
minimumReleaseAgeExcludes = ["brace-expansion", "dompurify", "fast-uri", "hono", "js-yaml", "mermaid", "nanoid"]
