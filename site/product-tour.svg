<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" fill="none">
  <title>Woodshed workflow: start with the day, connect context while writing, and recover the trail later</title>
  <!-- All displayed names and record content are synthetic. -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0F0C"/>
      <stop offset="0.52" stop-color="#141712"/>
      <stop offset="1" stop-color="#0D0F0C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20231F"/>
      <stop offset="1" stop-color="#171A16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F5F0E3" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <clipPath id="clip-one"><rect x="52" y="146" width="470" height="514" rx="13"/></clipPath>
    <clipPath id="clip-two"><rect x="565" y="146" width="470" height="514" rx="13"/></clipPath>
    <clipPath id="clip-three"><rect x="1078" y="146" width="470" height="514" rx="13"/></clipPath>
  </defs>

  <rect width="1600" height="720" fill="url(#canvas)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <g>
      <text x="52" y="61" fill="#748078" font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">01 / START</text>
      <text x="52" y="105" fill="#F6F1E6" font-family="Iowan Old Style, Baskerville, serif" font-size="32">See the whole day</text>
    </g>
    <g>
      <text x="565" y="61" fill="#748078" font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">02 / CONNECT</text>
      <text x="565" y="105" fill="#F6F1E6" font-family="Iowan Old Style, Baskerville, serif" font-size="32">Capture context once</text>
