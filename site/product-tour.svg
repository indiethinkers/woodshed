        <text x="1286" y="464" fill="#ECEBE6" font-size="11">Send recap by 3 PM</text>
        <rect x="1487" y="450" width="12" height="12" rx="3" stroke="#D36A3E" stroke-width="1.5"/>

        <rect x="1270" y="503" width="246" height="97" rx="7" fill="#151815" stroke="#303630"/>
        <text x="1286" y="525" fill="#6F786F" font-family="SFMono-Regular, Menlo, monospace" font-size="8">MENTIONED IN</text>
        <text x="1286" y="551" fill="#ECEBE6" font-size="11">Daily note · Today</text>
        <text x="1286" y="574" fill="#969D96" font-size="9">“Ask Morgan to walk through…”</text>
