        <text x="604" y="397" fill="#7D857D" font-family="SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.2">DECISION</text>
        <text x="604" y="423" fill="#C7CAC4" font-size="11">Lead with recovery, not configuration.</text>

        <rect x="604" y="459" width="300" height="51" rx="6" fill="#20241F" stroke="#354039"/>
        <rect x="619" y="476" width="12" height="12" rx="3" stroke="#D36A3E" stroke-width="1.5"/>
        <text x="643" y="487" fill="#E4E5E1" font-size="10">Send the review recap by 3 PM</text>

        <rect x="604" y="548" width="392" height="82" rx="7" fill="#141713" stroke="#2B302A"/>
        <text x="620" y="571" fill="#687168" font-family="SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.1">CONTEXT CREATED</text>
        <circle cx="625" cy="595" r="5" fill="#4E8D65"/>
        <text x="640" y="599" fill="#C7CBC4" font-size="10">Person link</text>
        <circle cx="735" cy="595" r="5" fill="#D36A3E"/>
        <text x="750" y="599" fill="#C7CBC4" font-size="10">Follow-up task</text>
        <circle cx="865" cy="595" r="5" fill="#777F77"/>
        <text x="880" y="599" fill="#C7CBC4" font-size="10">Backlink</text>
