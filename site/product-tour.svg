        <text x="130" y="373" fill="#C5C8C2" font-size="9">Send briefing</text>
        <circle cx="118" cy="399" r="5" stroke="#565D56" stroke-width="1.3"/>
        <text x="130" y="402" fill="#C5C8C2" font-size="9">Draft questions</text>
        <text x="108" y="446" fill="#697169" font-family="SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1">SCHEDULE</text>
